name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must be a conventional commit, e.g. 'feat(agent): add a cluster tool'. It becomes the squash commit and decides the release."
            exit 1
          fi
