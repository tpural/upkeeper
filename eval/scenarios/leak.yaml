name: leak
about: A memory leak gets the container OOMKilled again and again. A restart won't help; it needs a higher limit or a code fix, so a person.
manifests: |
  apiVersion: v1
  kind: ConfigMap
  metadata: {name: app}
  data:
    run: |
      echo 'thumbnailer: caching images in memory';
      i=0;
      while true;
      do i=$((i+1));
      head -c 4194304 /dev/urandom > /dev/shm/img$i;
      echo "cached image $i";
      sleep 1;
      done
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: thumbnailer}
  spec:
    replicas: 1
    selector: {matchLabels: {app: thumbnailer}}
    template:
      metadata: {labels: {app: thumbnailer}}
      spec:
        containers:
          - name: thumbnailer
            image: busybox:1.37.0
            command: ["sh", "/app/run"]
            resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 48Mi}}
            volumeMounts: [{name: app, mountPath: /app}, {name: shm, mountPath: /dev/shm}]
        volumes: [{name: app, configMap: {name: app, defaultMode: 0755}}, {name: shm, emptyDir: {medium: Memory}}]
settle: 4m
open:
  kind: incident
  title: $NS/$POD restarted 4 times in 30 minutes
  text: "alert fired: $NS/$POD restarted 4 times in 30 minutes"
expect:
  outcome: [escalated]
  mentions: [oom|memory]
